name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Vet & Race Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxxf86vm-dev

      - name: Go Vet
        run: go vet ./...

      - name: Run Core Race Tests
        run: go test -race -v -count=1 ./internal/meta ./internal/db ./internal/organizer ./internal/source ./internal/sync ./internal/version

      - name: Run UI & CLI Package Tests
        run: go test -v -count=1 ./internal/ui ./cmd/lumina-amber

  build-linux:
    name: Build Linux (amd64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxxf86vm-dev

      - name: Build Linux Binary
        run: |
          mkdir -p bin
          CGO_ENABLED=1 go build -ldflags="-s -w" -o bin/lumina-amber-linux-amd64 ./cmd/lumina-amber
          ./bin/lumina-amber-linux-amd64 -version
          tar -czf bin/lumina-amber-linux-amd64.tar.gz -C bin lumina-amber-linux-amd64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-amber-linux-amd64
          path: |
            bin/lumina-amber-linux-amd64
            bin/lumina-amber-linux-amd64.tar.gz
          retention-days: 14

  build-macos:
    name: Build macOS Universal (.app)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests on macOS
        run: go test -v -count=1 ./...

      - name: Build macOS Universal Binary (ARM64 + AMD64)
        run: |
          mkdir -p bin/macos
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CGO_CFLAGS="-mmacosx-version-min=11.0 -arch arm64" \
            CGO_LDFLAGS="-mmacosx-version-min=11.0 -arch arm64" \
            go build -ldflags="-s -w" -o bin/macos/lumina-amber-arm64 ./cmd/lumina-amber
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-mmacosx-version-min=11.0 -arch x86_64" \
            CGO_LDFLAGS="-mmacosx-version-min=11.0 -arch x86_64" \
            go build -ldflags="-s -w" -o bin/macos/lumina-amber-amd64 ./cmd/lumina-amber
          lipo -create -output bin/macos/lumina-amber \
            bin/macos/lumina-amber-arm64 \
            bin/macos/lumina-amber-amd64
          lipo -info bin/macos/lumina-amber
          ./bin/macos/lumina-amber -version

      - name: Package macOS App Bundle
        run: |
          chmod +x ./scripts/package-mac.sh
          ./scripts/package-mac.sh bin/macos/lumina-amber

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaAmber-macOS
          path: bin/macos/LuminaAmber-macOS.zip
          retention-days: 14
